<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Tải Tệp An Toàn | Security Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="background-decorations">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <main class="container">
    <div class="card glass">
      <div class="card-header">
        <div class="icon-badge">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>
        <h1>BeeAuto</h1>
        <p class="subtitle">Tổ hợp phím CLTR+L trong game để lấy License Id máy,bang,tộc</p>
      </div>

      <form id="access-form" class="form-group" autocomplete="off">
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="m21 2-2 2m-1.5 1.5L16 7m-1.5 1.5L13 10m-3-3 2 2m-2-2a5 5 0 0 0-7.07 7.07L13 24l5-5-2-2 2-2-2-2 2-2-2-2" />
          </svg>
          <input type="password" id="password-input" placeholder="Nhập Id License của bạn để truy cập..." required
            autofocus>
          <button type="button" id="toggle-password" class="icon-btn" aria-label="Hiện mật khẩu">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>

        <div id="status-message" class="status-message"></div>

        <button type="submit" id="submit-btn" class="btn btn-primary">
          <span>Xác Nhận & Mở Khóa</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </button>
      </form>

      <div class="card-footer">
        <span class="protection-tag">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" />
          </svg>
          Mã hóa SHA-256 an toàn
        </span>
      </div>
    </div>
  </main>

  <script src="./passwords.js"></script>
  <script src="./app.js"></script>
</body>

</html>
